<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeRush | Meme-Fi Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        body {
            background-color: #0a0f1e;
            color: #e2e8f0;
            height: 700px;
            min-width: 1200px;
            overflow: hidden;
        }

        /* 导航栏 */
        .navbar {
            background-color: #0d1423;
            border-bottom: 1px solid #1e293b;
            padding: 0 24px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border-radius: 6px;
        }
        .logo-text {
            font-size: 18px; font-weight: 700;
            background: linear-gradient(to right, #fbbf24, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .wallet-connect-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white; border: none; border-radius: 6px;
            padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s;
        }
        .wallet-connect-btn:hover { opacity: 0.9; }

        /* 主内容 */
        .main-content {
            padding: 16px 20px 0;
            height: calc(100% - 88px);
            overflow-x: auto;
            overflow-y: hidden;
        }

        .columns-container {
            display: flex;
            gap: 14px;
            height: 100%;
            min-width: min-content;
        }

        /* 通用列 */
        .column {
            flex: 0 0 290px;
            background-color: #0d1423;
            border-radius: 10px;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        /* Meme-Fi 列高亮 */
        .column-memefi {
            flex: 0 0 310px;
            border: 2px solid #fbbf24;
            border-left-width: 3px;
            box-shadow: 0 0 24px rgba(251,191,36,0.12), inset 0 0 0 1px rgba(251,191,36,0.05);
        }

        /* 列头 */
        .column-header {
            padding: 12px 14px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(13,20,35,0.95);
            flex-shrink: 0;
        }
        .column-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
        .badge {
            background-color: #1e3a5f; color: #60a5fa;
            font-size: 11px; padding: 2px 7px; border-radius: 8px; font-weight: 600;
        }
        .badge-gold { background-color: rgba(251,191,36,0.15); color: #fbbf24; }
        .sort-indicator { font-size: 11px; color: #64748b; }

        /* 代币列表 */
        .token-list { flex: 1; overflow-y: auto; padding: 2px 0; }

        /* 代币行 */
        .token-row {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(30,41,59,0.6);
            transition: background-color 0.12s;
        }
        .token-row:hover { background-color: rgba(255,255,255,0.03); }
        .token-row-memefi { cursor: pointer; }
        .token-row-memefi:hover { background-color: rgba(139,92,246,0.06); }

        .token-name-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }
        .token-name { font-weight: 600; font-size: 13px; }

        .chain-badge {
            font-size: 10px; font-weight: 700; padding: 2px 6px;
            border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .chain-sol { background: rgba(139,92,246,0.2); color: #a78bfa; border: 1px solid rgba(139,92,246,0.35); }
        .chain-bsc { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.35); }

        .token-data { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .data-item { display: flex; justify-content: space-between; align-items: center; }
        .label { color: #64748b; font-size: 11px; }
        .value { font-size: 12px; font-weight: 500; }
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        .neutral { color: #94a3b8; }

        /* 底部注释 */
        .footer-note {
            padding: 10px 20px;
            text-align: center; color: #475569; font-size: 11px;
            border-top: 1px solid #1e293b; height: 36px;
            display: flex; align-items: center; justify-content: center;
        }

        /* 右侧详情面板 */
        .detail-panel {
            position: fixed; top: 0; right: 0;
            width: 300px; height: 100%;
            background-color: #0d1423;
            border-left: 1px solid rgba(251,191,36,0.3);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
            display: flex; flex-direction: column;
        }
        .detail-panel.active { transform: translateX(0); }

        .panel-header {
            padding: 16px 18px;
            border-bottom: 1px solid #1e293b;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(135deg, rgba(251,191,36,0.05), transparent);
        }
        .panel-title { font-size: 15px; font-weight: 600; }
        .close-btn {
            background: none; border: none; color: #64748b;
            font-size: 18px; cursor: pointer; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
        }
        .close-btn:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }

        .panel-content { flex: 1; padding: 18px; overflow-y: auto; }

        .info-item { margin-bottom: 16px; }
        .info-label { color: #64748b; font-size: 12px; margin-bottom: 4px; }
        .info-value { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .discount-tag {
            font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
            background: rgba(16,185,129,0.15); color: #10b981;
        }
        .protocol-tag { font-size: 11px; padding: 2px 7px; border-radius: 4px; }
        .protocol-sol { background: rgba(139,92,246,0.15); color: #a78bfa; }
        .protocol-bsc { background: rgba(251,191,36,0.15); color: #fbbf24; }

        .divider { height: 1px; background: #1e293b; margin: 16px 0; }

        .action-btn {
            width: 100%; padding: 11px; border-radius: 7px;
            font-weight: 600; font-size: 13px; border: none; cursor: pointer;
            transition: opacity 0.15s; margin-bottom: 8px; text-align: center;
        }
        .btn-primary { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.07); color: #cbd5e1; border: 1px solid #334155; }
        .btn-long { background: linear-gradient(135deg, #059669, #10b981); color: white; }
        .btn-short { background: linear-gradient(135deg, #dc2626, #ef4444); color: white; }
        .action-btn:hover { opacity: 0.88; }

        .leverage-row { display: flex; gap: 6px; margin: 12px 0; }
        .lev-btn {
            flex: 1; padding: 7px 0; background: rgba(255,255,255,0.05);
            border: 1px solid #334155; border-radius: 5px; color: #94a3b8;
            font-size: 12px; font-weight: 600; cursor: pointer; text-align: center;
            transition: all 0.12s;
        }
        .lev-btn.active { background: rgba(59,130,246,0.2); border-color: #3b82f6; color: #60a5fa; }
        .lev-btn:hover:not(.active) { background: rgba(255,255,255,0.08); }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-logo">
        <div class="logo-icon"></div>
        <div class="logo-text">MemeRush</div>
    </div>
    <button class="wallet-connect-btn" id="connectBtn">连接钱包</button>
</nav>

<main class="main-content">
    <div class="columns-container">
        <div class="column">
            <div class="column-header">
                <div class="column-title">🆕 New <span class="badge">14</span></div>
                <div class="sort-indicator">按市值 ↓</div>
            </div>
            <div class="token-list" id="new-list"></div>
        </div>
        <div class="column">
            <div class="column-header">
                <div class="column-title">🔥 Hot <span class="badge">11</span></div>
                <div class="sort-indicator">按 24h 涨幅 ↓</div>
            </div>
            <div class="token-list" id="hot-list"></div>
        </div>
        <div class="column">
            <div class="column-header">
                <div class="column-title">📈 Trending <span class="badge">9</span></div>
                <div class="sort-indicator">按持有人 ↓</div>
            </div>
            <div class="token-list" id="trending-list"></div>
        </div>
        <div class="column column-memefi">
            <div class="column-header">
                <div class="column-title">💎 Meme-Fi <span class="badge badge-gold">6</span></div>
                <div class="sort-indicator">按涨跌幅 ↓</div>
            </div>
            <div class="token-list" id="memefi-list"></div>
        </div>
    </div>
</main>

<div class="footer-note">
    💎 Meme-Fi 列不受 7 天新币限制 &nbsp;·&nbsp; SOL → Rise.rich 地板价借贷/Loop &nbsp;·&nbsp; BSC → Likwid 5x 隔离保证金
</div>

<div class="detail-panel" id="detailPanel">
    <div class="panel-header">
        <div class="panel-title" id="panelTitle">代币详情</div>
        <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <div class="panel-content" id="panelContent"></div>
</div>

<script>
(function() {
    const newTokens = [
        { name: 'DOGS',  chain: 'SOL', cap: '$12.5M', h1: '+8.2%',  h24: '+45.3%', holders: '12.4k', p1: 'positive', p2: 'positive' },
        { name: 'CATZ',  chain: 'BSC', cap: '$8.2M',  h1: '-2.1%',  h24: '+18.7%', holders: '8.7k',  p1: 'negative', p2: 'positive' },
        { name: 'BIRDS', chain: 'SOL', cap: '$5.6M',  h1: '+15.3%', h24: '+62.1%', holders: '6.9k',  p1: 'positive', p2: 'positive' },
        { name: 'FISH',  chain: 'BSC', cap: '$3.9M',  h1: '+3.2%',  h24: '+22.8%', holders: '4.3k',  p1: 'positive', p2: 'positive' },
        { name: 'MOON',  chain: 'SOL', cap: '$18.2M', h1: '-5.7%',  h24: '+32.4%', holders: '15.6k', p1: 'negative', p2: 'positive' },
    ];
    const hotTokens = [
        { name: 'PUMP',    chain: 'BSC', cap: '$25.3M', h1: '+12.5%', h24: '+85.2%',  holders: '21.4k', p1: 'positive', p2: 'positive' },
        { name: 'ROCKET',  chain: 'BSC', cap: '$14.7M', h1: '+22.4%', h24: '+112.8%', holders: '13.2k', p1: 'positive', p2: 'positive' },
        { name: 'LAMBO',   chain: 'SOL', cap: '$9.5M',  h1: '+6.8%',  h24: '+56.3%',  holders: '9.8k',  p1: 'positive', p2: 'positive' },
        { name: 'DUMP',    chain: 'SOL', cap: '$6.8M',  h1: '-8.3%',  h24: '+42.1%',  holders: '7.9k',  p1: 'negative', p2: 'positive' },
        { name: 'DIAMOND', chain: 'BSC', cap: '$7.2M',  h1: '-1.5%',  h24: '+28.7%',  holders: '6.5k',  p1: 'negative', p2: 'positive' },
    ];
    const trendingTokens = [
        { name: 'WHALE', chain: 'BSC', cap: '$45.2M', h1: '+3.8%',  h24: '+42.6%', holders: '32.6k', p1: 'positive', p2: 'positive' },
        { name: 'APE',   chain: 'SOL', cap: '$32.8M', h1: '+9.2%',  h24: '+68.4%', holders: '28.7k', p1: 'positive', p2: 'positive' },
        { name: 'BULL',  chain: 'BSC', cap: '$19.6M', h1: '+18.3%', h24: '+94.2%', holders: '17.9k', p1: 'positive', p2: 'positive' },
        { name: 'SHARK', chain: 'SOL', cap: '$12.7M', h1: '+14.9%', h24: '+78.3%', holders: '11.4k', p1: 'positive', p2: 'positive' },
        { name: 'BEAR',  chain: 'SOL', cap: '$8.4M',  h1: '-12.5%', h24: '+15.8%', holders: '8.3k',  p1: 'negative', p2: 'positive' },
    ];
    const memeFiTokens = [
        { type: 'sol', name: 'MOON RATS',  chain: 'SOL', price: '$0.0328', floor: '$0.0190', discount: '42%', lev: '5x',   chg: '+67.2%', pchg: 'positive' },
        { type: 'bsc', name: 'BSC PUMP',   chain: 'BSC', price: '$0.0042', floor: null,      discount: null,  lev: '5x',   chg: '+51.8%', pchg: 'positive' },
        { type: 'sol', name: 'SOLANA DOG', chain: 'SOL', price: '$0.0245', floor: '$0.0176', discount: '28%', lev: '3x',   chg: '+38.4%', pchg: 'positive' },
        { type: 'sol', name: 'SOL CATS',   chain: 'SOL', price: '$0.0182', floor: '$0.0155', discount: '15%', lev: '2x',   chg: '+22.1%', pchg: 'positive' },
        { type: 'bsc', name: 'BSC DUMP',   chain: 'BSC', price: '$0.0068', floor: null,      discount: null,  lev: '5x',   chg: '-18.3%', pchg: 'negative' },
        { type: 'sol', name: 'SOL BIRDS',  chain: 'SOL', price: '$0.0097', floor: '$0.0089', discount: '8%',  lev: '1.5x', chg: '+9.7%',  pchg: 'positive' },
    ];

    function chainClass(c) { return c === 'SOL' ? 'chain-sol' : 'chain-bsc'; }

    function renderExisting(listId, tokens) {
        const el = document.getElementById(listId);
        tokens.forEach(t => {
            el.insertAdjacentHTML('beforeend', `
                <div class="token-row">
                    <div class="token-name-row">
                        <span class="token-name">${t.name}</span>
                        <span class="chain-badge ${chainClass(t.chain)}">${t.chain}</span>
                    </div>
                    <div class="token-data">
                        <div class="data-item"><span class="label">市值</span><span class="value">${t.cap}</span></div>
                        <div class="data-item"><span class="label">1h</span><span class="value ${t.p1}">${t.h1}</span></div>
                        <div class="data-item"><span class="label">24h</span><span class="value ${t.p2}">${t.h24}</span></div>
                        <div class="data-item"><span class="label">持有人</span><span class="value">${t.holders}</span></div>
                    </div>
                </div>`);
        });
    }

    function renderMemeFi() {
        const el = document.getElementById('memefi-list');
        memeFiTokens.forEach(t => {
            const discountHtml = t.discount
                ? `<div class="data-item"><span class="label">地板折扣</span><span class="value positive">${t.discount}</span></div>`
                : `<div class="data-item"><span class="label">地板折扣</span><span class="value neutral">—</span></div>`;
            const row = document.createElement('div');
            row.className = 'token-row token-row-memefi';
            row.innerHTML = `
                <div class="token-name-row">
                    <span class="token-name">${t.name}</span>
                    <span class="chain-badge ${chainClass(t.chain)}">${t.chain}</span>
                </div>
                <div class="token-data">
                    <div class="data-item"><span class="label">价格</span><span class="value">${t.price}</span></div>
                    ${discountHtml}
                    <div class="data-item"><span class="label">杠杆上限</span><span class="value">${t.lev}</span></div>
                    <div class="data-item"><span class="label">24h</span><span class="value ${t.pchg}">${t.chg}</span></div>
                </div>`;
            row.addEventListener('click', () => openPanel(t));
            el.appendChild(row);
        });
    }

    function openPanel(t) {
        document.getElementById('panelTitle').textContent = t.name;
        const c = document.getElementById('panelContent');

        if (t.type === 'sol') {
            c.innerHTML = `
                <div class="info-item">
                    <div class="info-label">链 / 协议</div>
                    <div class="info-value">
                        <span class="chain-badge chain-sol">SOL</span>
                        <span class="protocol-tag protocol-sol">Rise.rich</span>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label">当前价格</div>
                    <div class="info-value">${t.price}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">地板价</div>
                    <div class="info-value">${t.floor} <span class="discount-tag">折扣 ${t.discount}</span></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Loop 杠杆上限</div>
                    <div class="info-value">${t.lev}</div>
                </div>
                <div class="divider"></div>
                <button class="action-btn btn-primary" onclick="showToast('地板价借贷 — Rise.rich')">地板价借贷 (Borrow)</button>
                <button class="action-btn btn-secondary" onclick="showToast('Loop 杠杆循环 — Rise.rich')">杠杆循环 (Loop)</button>`;
        } else {
            c.innerHTML = `
                <div class="info-item">
                    <div class="info-label">链 / 协议</div>
                    <div class="info-value">
                        <span class="chain-badge chain-bsc">BSC</span>
                        <span class="protocol-tag protocol-bsc">Likwid</span>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label">当前价格</div>
                    <div class="info-value">${t.price}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">隔离保证金 / 最高杠杆</div>
                    <div class="info-value">${t.lev}</div>
                </div>
                <div class="divider"></div>
                <div class="info-label" style="margin-bottom:8px;">选择杠杆倍数</div>
                <div class="leverage-row" id="levRow">
                    <button class="lev-btn active">1x</button>
                    <button class="lev-btn">2x</button>
                    <button class="lev-btn">3x</button>
                    <button class="lev-btn">5x</button>
                </div>
                <div class="two-col" style="margin-top:12px;">
                    <button class="action-btn btn-long" onclick="showToast('做多开仓 — Likwid 隔离保证金')">做多 Long</button>
                    <button class="action-btn btn-short" onclick="showToast('做空开仓 — Likwid 隔离保证金')">做空 Short</button>
                </div>`;
            document.querySelectorAll('#levRow .lev-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#levRow .lev-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        }
        document.getElementById('detailPanel').classList.add('active');
    }

    window.showToast = function(msg) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.style.cssText = 'position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:#93c5fd;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid #3b82f6;z-index:9999;pointer-events:none;transition:opacity 0.3s;';
            document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        clearTimeout(toast._t);
        toast._t = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    };

    document.addEventListener('DOMContentLoaded', () => {
        renderExisting('new-list', newTokens);
        renderExisting('hot-list', hotTokens);
        renderExisting('trending-list', trendingTokens);
        renderMemeFi();

        document.getElementById('closeBtn').addEventListener('click', () => {
            document.getElementById('detailPanel').classList.remove('active');
        });

        document.getElementById('connectBtn').addEventListener('click', function() {
            this.textContent = '0x8f7…c3b2 ✓';
            this.style.background = 'linear-gradient(135deg,#059669,#10b981)';
        });
    });
})();
</script>
</body>
</html>
